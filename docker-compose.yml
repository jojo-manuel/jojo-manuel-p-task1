version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=joineazy_super_secret_jwt_key_2026
      # Add Neon DB connection string or PostgreSQL URL below if using cloud database:
      # - DATABASE_URL=postgresql://neondb_owner:password@ep-sample-12345.us-east-2.aws.neon.tech/neondb?sslmode=require
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joineazy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
