name: Vercel CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: 🏗️ CI - Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 📦 Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          fi

      - name: 🔨 Build Production Assets
        run: npm run build

  deploy-to-vercel:
    name: 🚀 CD - Vercel Deployment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Deploy to Vercel via CLI (If Secrets Configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel Secrets detected. Deploying via Vercel CLI..."
            npm install -g vercel
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            vercel build --prod --token=$VERCEL_TOKEN
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            echo "Vercel CLI Secrets not found in GitHub Secrets."
            echo "Relying on Vercel Native GitHub Repository Integration for automatic deployment on push to main."
          fi
